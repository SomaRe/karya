<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karya</title>
  <style>
    :root { color-scheme: light; --ink:#17222e; --muted:#637083; --line:#dce2e8; --paper:#fff; --wash:#f4f6f8; --navy:#172c3f; --accent:#176b87; --danger:#a63232; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--wash); color:var(--ink); font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .shell { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:100vh; }
    .sidebar { background:var(--navy); color:#ecf4f6; padding:22px 14px; }
    .brand { margin:0 8px 24px; font:700 20px/1 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; }
    .nav-label { margin:22px 8px 7px; color:#a7c0c8; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .nav-button { display:block; width:100%; border:0; border-radius:6px; background:transparent; color:inherit; padding:9px 10px; text-align:left; overflow-wrap:anywhere; }
    .nav-button:hover,.nav-button.active { background:#29485a; }
    .nav-button.area { color:#cce1e4; padding-left:18px; font-size:14px; }
    .main { min-width:0; padding:28px clamp(16px,4vw,48px); }
    .topline { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; }
    h1 { margin:0; font-size:clamp(24px,4vw,36px); letter-spacing:-.04em; }
    .subtitle { margin:5px 0 0; color:var(--muted); }
    .menu { display:none; border:1px solid var(--line); border-radius:6px; background:var(--paper); padding:7px 10px; }
    .error { display:none; margin:0 0 16px; border-left:4px solid var(--danger); background:#fff2f2; color:#6e1b1b; padding:10px 12px; }
    .error.visible { display:block; }
    .filters { display:grid; grid-template-columns:repeat(5,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
    label { color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    label span { display:block; margin-bottom:4px; }
    input,select { width:100%; min-height:38px; border:1px solid var(--line); border-radius:5px; background:var(--paper); color:var(--ink); padding:7px 9px; }
    .cards { display:grid; gap:8px; }
    .ticket { display:grid; grid-template-columns:116px minmax(0,1fr) auto; gap:14px; align-items:center; width:100%; border:1px solid var(--line); border-radius:7px; background:var(--paper); color:inherit; padding:14px; text-align:left; }
    .ticket:hover { border-color:#9db3bd; box-shadow:0 2px 10px #17222e12; }
    .key { color:var(--accent); font:700 13px/1 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .ticket-title { display:block; font-weight:700; overflow-wrap:anywhere; }
    .ticket-meta { display:block; margin-top:3px; color:var(--muted); font-size:13px; }
    .badge { border-radius:999px; background:#e8f0f2; color:#31515e; padding:4px 8px; font-size:12px; font-weight:700; white-space:nowrap; }
    .empty { border:1px dashed #b8c5cc; border-radius:7px; color:var(--muted); padding:32px 18px; text-align:center; }
    .overlay { display:none; }
    .drawer { position:fixed; z-index:3; top:0; right:0; width:min(560px,100vw); height:100vh; transform:translateX(100%); transition:transform .2s ease; background:var(--paper); box-shadow:-8px 0 30px #17222e33; overflow:auto; padding:26px; }
    .drawer.open { transform:translateX(0); }
    .drawer-top { display:flex; justify-content:space-between; gap:12px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:16px; }
    .close { border:0; background:transparent; color:var(--muted); font-size:26px; line-height:1; }
    .detail-title { margin:22px 0 18px; font-size:26px; line-height:1.2; overflow-wrap:anywhere; }
    .metadata { display:grid; grid-template-columns:120px 1fr; gap:8px 12px; margin:0; }
    .metadata dt { color:var(--muted); font-size:13px; }
    .metadata dd { margin:0; overflow-wrap:anywhere; }
    .description { margin-top:24px; border-top:1px solid var(--line); padding-top:18px; }
    .description h2 { margin:0 0 8px; font-size:15px; }
    pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
    @media (max-width:760px) { .shell { display:block; } .sidebar { position:fixed; z-index:4; inset:0 auto 0 0; width:min(280px,82vw); transform:translateX(-100%); transition:transform .2s ease; overflow:auto; } .sidebar.open { transform:translateX(0); } .overlay.open { display:block; position:fixed; z-index:2; inset:0; background:#17222e66; } .menu { display:block; } .main { padding:18px 14px; } .filters { grid-template-columns:repeat(2,minmax(0,1fr)); } .filters label:first-child { grid-column:span 2; } .ticket { grid-template-columns:1fr auto; } .ticket .key { grid-column:1; } .ticket .ticket-copy { grid-column:1 / -1; grid-row:2; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"><p class="brand">Karya</p><nav id="navigation" aria-label="Projects and areas"></nav></aside>
    <main class="main">
      <header class="topline"><div><h1 id="heading">Tickets</h1><p class="subtitle" id="subheading">Choose a project to browse its tickets.</p></div><button class="menu" id="menu" type="button" aria-label="Open navigation">Menu</button></header>
      <div class="error" id="error" role="alert"></div>
      <section class="filters" aria-label="Ticket filters">
        <label><span>Title search</span><input id="search" type="search" placeholder="Search titles"></label>
        <label><span>Status</span><select id="status"><option value="">All statuses</option><option value="backlog">Backlog</option><option value="in-progress">In progress</option><option value="review">Review</option><option value="done">Done</option><option value="cancelled">Cancelled</option></select></label>
        <label><span>Type</span><select id="type"><option value="">All types</option><option value="task">Task</option><option value="bug">Bug</option><option value="spike">Spike</option></select></label>
        <label><span>Priority</span><select id="priority"><option value="">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>
        <label><span>Flagged</span><select id="flagged"><option value="">All tickets</option><option value="true">Flagged</option><option value="false">Not flagged</option></select></label>
      </section>
      <section class="cards" id="tickets" aria-live="polite"></section>
    </main>
  </div>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Ticket details"><div class="drawer-top"><span class="key" id="detail-key"></span><button class="close" id="close" type="button" aria-label="Close ticket details">&times;</button></div><div id="detail"></div></aside>
  <script>
    const state = { projects: [], project: null, area: "", areas: [], searchTimer: null };
    const $ = id => document.getElementById(id);
    const filters = ["search", "status", "type", "priority", "flagged"];

    function element(tag, text, className) { const node = document.createElement(tag); if (text !== undefined) node.textContent = text; if (className) node.className = className; return node; }
    function showError(message) { const box = $("error"); box.textContent = message; box.classList.add("visible"); }
    function clearError() { $("error").textContent = ""; $("error").classList.remove("visible"); }
    async function request(path) { const response = await fetch(path); const body = await response.json().catch(() => null); if (!response.ok) throw new Error(body && body.error ? body.error.message : `Request failed (${response.status})`); return body; }
    function closeNavigation() { $("sidebar").classList.remove("open"); $("overlay").classList.remove("open"); }
    function closeDetail() { $("drawer").classList.remove("open"); $("overlay").classList.remove("open"); }

    async function loadProjects() {
      clearError();
      try {
        state.projects = await request("/api/v1/projects");
        if (state.projects.length) await selectProject(state.projects[0].key);
        else { renderNavigation(); renderTickets([]); $("subheading").textContent = "No projects are available."; }
      } catch (error) { showError(error.message); }
    }
    async function selectProject(key) {
      state.project = key; state.area = ""; closeNavigation();
      try { state.areas = await request(`/api/v1/projects/${encodeURIComponent(key)}/areas`); renderNavigation(); await loadTickets(); }
      catch (error) { showError(error.message); }
    }
    function selectArea(slug) { state.area = slug; closeNavigation(); renderNavigation(); loadTickets(); }
    function renderNavigation() {
      const nav = $("navigation"); nav.replaceChildren();
      if (state.projects.length) {
        nav.append(element("p", "Projects", "nav-label"));
        state.projects.forEach(project => { const button = element("button", `${project.key}  ${project.name}`, "nav-button"); if (project.key === state.project) button.classList.add("active"); button.addEventListener("click", () => selectProject(project.key)); nav.append(button); });
      }
      if (state.project) {
        nav.append(element("p", "Areas", "nav-label"));
        const all = element("button", "All areas", "nav-button area"); if (!state.area) all.classList.add("active"); all.addEventListener("click", () => selectArea("")); nav.append(all);
        state.areas.forEach(area => { const button = element("button", area.name, "nav-button area"); if (area.slug === state.area) button.classList.add("active"); button.addEventListener("click", () => selectArea(area.slug)); nav.append(button); });
      }
    }
    async function loadTickets() {
      if (!state.project) return;
      clearError();
      const query = new URLSearchParams({ project: state.project });
      if (state.area) query.set("area", state.area);
      filters.forEach(name => { const value = $(name).value.trim(); if (value) query.set(name, value); });
      $("heading").textContent = state.project;
      const area = state.areas.find(item => item.slug === state.area);
      $("subheading").textContent = area ? `Tickets in ${area.name}` : "All tickets";
      try { renderTickets(await request(`/api/v1/tickets?${query}`)); } catch (error) { renderTickets([]); showError(error.message); }
    }
    function renderTickets(tickets) {
      const list = $("tickets"); list.replaceChildren();
      if (!tickets.length) { list.append(element("p", "No tickets match these filters.", "empty")); return; }
      tickets.forEach(ticket => {
        const button = element("button", undefined, "ticket");
        button.type = "button";
        button.append(element("span", ticket.key, "key"));
        const copy = element("span", undefined, "ticket-copy"); copy.append(element("span", ticket.title, "ticket-title"));
        copy.append(element("span", `${ticket.type} · ${ticket.priority}${ticket.flagged ? " · flagged" : ""}`, "ticket-meta"));
        button.append(copy); button.append(element("span", ticket.status, "badge"));
        button.addEventListener("click", () => openTicket(ticket.key)); list.append(button);
      });
    }
    async function openTicket(key) {
      try { const [ticket, notes] = await Promise.all([request(`/api/v1/tickets/${encodeURIComponent(key)}?project=${encodeURIComponent(state.project)}`), request(`/api/v1/tickets/${encodeURIComponent(key)}/notes?project=${encodeURIComponent(state.project)}`)]); renderDetail(ticket, notes); $("drawer").classList.add("open"); $("overlay").classList.add("open"); }
      catch (error) { showError(error.message); }
    }
    function renderDetail(ticket, notes) {
      $("detail-key").textContent = ticket.key;
      const detail = $("detail"); detail.replaceChildren(); detail.append(element("h2", ticket.title, "detail-title"));
      const metadata = element("dl", undefined, "metadata");
      const area = ticket.area_id ? (state.areas.find(item => item.id === ticket.area_id)?.name || `Area ${ticket.area_id}`) : "None";
      [["Status", ticket.status], ["Type", ticket.type], ["Priority", ticket.priority], ["Flagged", ticket.flagged ? "Yes" : "No"], ["Area", area], ["Parent", ticket.parent_key || "None"], ["Revision", String(ticket.revision)], ["Created", formatDate(ticket.created_at)], ["Updated", formatDate(ticket.updated_at)]].forEach(([label, value]) => { metadata.append(element("dt", label)); metadata.append(element("dd", value)); });
      detail.append(metadata); const description = element("section", undefined, "description"); description.append(element("h2", "Description")); description.append(element("pre", ticket.description || "No description.")); detail.append(description);
      if (ticket.cancellation_reason) { const cancellation = element("section", undefined, "description"); cancellation.append(element("h2", "Cancellation reason")); cancellation.append(element("pre", ticket.cancellation_reason)); detail.append(cancellation); }
      const activity = element("section", undefined, "description"); activity.append(element("h2", "Notes"));
      if (!notes.length) activity.append(element("p", "No notes."));
      notes.forEach(note => { const entry = element("div", undefined, "note"); entry.append(element("strong", note.actor || (note.kind === "cancellation" ? "Karya" : "Unattributed"))); entry.append(element("span", ` · ${formatDate(note.created_at)} · ${note.kind}`, "ticket-meta")); entry.append(element("pre", note.body)); activity.append(entry); }); detail.append(activity);
    }
    function formatDate(value) { const date = new Date(value); return Number.isNaN(date.valueOf()) ? "Unknown" : date.toLocaleString(); }
    $("menu").addEventListener("click", () => { $("sidebar").classList.add("open"); $("overlay").classList.add("open"); });
    $("overlay").addEventListener("click", () => { closeNavigation(); closeDetail(); });
    $("close").addEventListener("click", closeDetail);
    document.addEventListener("keydown", event => { if (event.key === "Escape") { closeNavigation(); closeDetail(); } });
    filters.forEach(name => $(name).addEventListener(name === "search" ? "input" : "change", () => { clearTimeout(state.searchTimer); state.searchTimer = setTimeout(loadTickets, name === "search" ? 200 : 0); }));
    loadProjects();
  </script>
</body>
</html>
